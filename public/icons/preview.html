<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scopwise Icon System</title>
  <style>
    :root { color-scheme: light; --ink: #17243a; --paper: #f8f7f3; --line: #d9dde3; --muted: #708096; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 "Avenir Next", Manrope, sans-serif; }
    header, section { padding: 40px clamp(24px, 6vw, 88px); }
    header { border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 8px; font-size: 32px; font-weight: 500; letter-spacing: 0; }
    h2 { margin: 0 0 20px; font-size: 18px; font-weight: 600; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); }
    section + section { border-top: 1px solid var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .item { min-height: 112px; padding: 20px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .item img { width: 24px; height: 24px; color: var(--ink); }
    .item span { color: var(--muted); font-size: 12px; }
    .product .item:nth-child(1) { background: #dcecf7; }
    .product .item:nth-child(2) { background: #e7dff5; }
    .product .item:nth-child(3) { background: #dcede1; }
  </style>
</head>
<body>
  <header>
    <h1>Scopwise icon system</h1>
    <p>24 px master grid · 1.75 px stroke · rounded terminals · currentColor</p>
  </header>
  <main id="catalog"></main>
  <script>
    const groups = {
      Navigation: ["chevron-down", "menu", "close", "arrow-left"],
      Actions: ["arrow-right", "arrow-up-right", "play", "check", "plus", "minus", "search", "filter", "download", "copy", "calendar", "mail"],
      Products: ["map", "rules", "review"],
      Platform: ["bot", "database", "apps", "workflow", "shield-check", "lock", "eye", "history", "file-check", "users", "globe", "building"],
      Social: ["linkedin", "x", "github", "youtube", "instagram"]
    };
    const root = document.querySelector("#catalog");
    for (const [group, icons] of Object.entries(groups)) {
      const folder = group.toLowerCase();
      const section = document.createElement("section");
      section.className = group === "Products" ? "product" : "";
      section.innerHTML = `<h2>${group}</h2><div class="grid">${icons.map(icon => `<div class="item"><img src="${folder}/${icon}.svg" alt=""><span>${icon}</span></div>`).join("")}</div>`;
      root.append(section);
    }
  </script>
</body>
</html>
